<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-title" content="Lead Studio" />
    <title>Physique 57 | Lead Studio</title>
    <meta name="description" content="Lead management portal for Physique 57 studio locations" />
    <!-- The mark lives in public/favicon.svg, kept in step with
         src/components/Logo.jsx. SVG first for browsers that take it; the .ico
         is the fallback and carries three sizes, with a barre-less variant in
         the 16px slot where the full mark turns to mush. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#e11d48" />

    <!-- Link previews. The portal is private, but its URLs get pasted into
         Slack and WhatsApp constantly, and an unfurl with no card looks broken. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Physique 57 Lead Studio" />
    <meta property="og:title" content="Physique 57 | Lead Studio" />
    <meta property="og:description" content="Lead management portal for Physique 57 studio locations" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Physique 57 | Lead Studio" />
    <meta name="twitter:description" content="Lead management portal for Physique 57 studio locations" />
    <meta name="twitter:image" content="/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
